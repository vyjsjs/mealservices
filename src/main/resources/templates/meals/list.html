<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>식단 목록</title>
    <!-- 간단한 스타일 적용 -->
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr:hover { background-color: #f5f5f5; cursor: pointer; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 10px 20px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h1>📅 나의 식단 기록</h1>
    <!-- 11주차에 구현할 기능이지만 버튼만 미리 배치 -->
    <a href="#" class="btn">새 기록 추가하기</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>날짜</th>
        <th>구분</th>
        <th>메뉴 설명</th>
        <th>칼로리</th>
        <th>상세보기</th>
    </tr>
    </thead>
    <tbody>
    <!-- Thymeleaf 반복문 (th:each) -->
    <!-- Controller에서 넘겨준 "meals" 리스트를 순회하며 출력 -->
    <tr th:each="meal : ${meals}">
        <td th:text="${meal.id}">1</td>
        <td th:text="${meal.mealDate}">2023-11-24</td>
        <td th:text="${meal.mealName}">점심</td>
        <td th:text="${meal.menuDescription}">김치찌개</td>
        <td th:text="${meal.calories} + ' kcal'">700 kcal</td>
        <td>
            <!-- 상세 페이지 링크 생성 /meals/{id} -->
            <a th:href="@{/meals/{id}(id=${meal.id})}">조회</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
