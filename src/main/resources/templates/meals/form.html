<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>식사 기록하기</title>
</head>
<body>
<h1 th:text="${id == null} ? '🍽️ 새 식사 등록' : '✏️ 식사 기록 수정'">식사 등록</h1>

<form th:action="${id == null} ? @{/meals/new} : @{/meals/{id}/edit(id=${id})}"
      th:object="${mealRequest}"
      method="post">

    <div>
        <label for="mealDate">날짜:</label>
        <input type="date" id="mealDate" th:field="*{mealDate}" required>
    </div>

    <div>
        <label for="mealName">식사 구분:</label>
        <select id="mealName" th:field="*{mealName}">
            <option value="아침">아침</option>
            <option value="점심">점심</option>
            <option value="저녁">저녁</option>
            <option value="간식">간식</option>
        </select>
    </div>

    <div>
        <label for="menuDescription">메뉴 설명:</label>
        <input type="text" id="menuDescription" th:field="*{menuDescription}" placeholder="예: 닭가슴살 샐러드" required>
    </div>

    <div>
        <label for="calories">칼로리 (kcal):</label>
        <input type="number" id="calories" th:field="*{calories}" placeholder="0">
    </div>

    <br>
    <button type="submit">저장하기</button>
    <button type="button" onclick="history.back()">취소</button>
</form>
</body>
</html>
