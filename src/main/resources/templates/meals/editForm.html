<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>식사 기록 수정</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;
        }
        .btn { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn-cancel { background-color: #6c757d; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

<h1>📝 식사 기록 수정</h1>

<!-- 수정 URL: /meals/{id}/edit 로 POST 요청 -->
<form th:action="@{/meals/{id}/edit(id=${id})}" th:object="${mealRequest}" method="post">

    <div class="form-group">
        <label for="mealDate">날짜</label>
        <input type="date" id="mealDate" th:field="*{mealDate}" required>
    </div>

    <div class="form-group">
        <label for="mealName">식사 구분</label>
        <input type="text" id="mealName" th:field="*{mealName}" required>
    </div>

    <div class="form-group">
        <label for="menuDescription">메뉴 설명</label>
        <input type="text" id="menuDescription" th:field="*{menuDescription}" required>
    </div>

    <div class="form-group">
        <label for="calories">칼로리 (kcal)</label>
        <input type="number" id="calories" th:field="*{calories}">
    </div>

    <button type="submit" class="btn">수정 완료</button>
    <a th:href="@{/meals/{id}(id=${id})}" class="btn btn-cancel">취소</a>
</form>

</body>
</html>
