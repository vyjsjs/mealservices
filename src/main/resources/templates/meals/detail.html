<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>식단 상세 조회</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        .info-group { margin-bottom: 15px; }
        .label { font-weight: bold; display: block; margin-bottom: 5px; color: #666; }
        .value { font-size: 1.1em; }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        .btn { padding: 10px 15px; text-decoration: none; border-radius: 5px; color: white; text-align: center; }
        .btn-back { background-color: #6c757d; }
        .btn-edit { background-color: #007bff; }
    </style>
</head>
<body>

<h1>🍽️ 식단 상세 정보</h1>

<div class="card">
    <div class="info-group">
        <span class="label">식사 날짜</span>
        <span class="value" th:text="${meal.mealDate}">2023-11-24</span>
    </div>

    <div class="info-group">
        <span class="label">식사 구분</span>
        <span class="value" th:text="${meal.mealName}">점심</span>
    </div>

    <div class="info-group">
        <span class="label">메뉴</span>
        <span class="value" th:text="${meal.menuDescription}">된장찌개와 고등어구이</span>
    </div>

    <div class="info-group">
        <span class="label">칼로리</span>
        <span class="value" th:text="${meal.calories} + ' kcal'">800 kcal</span>
    </div>

    <div class="info-group">
        <span class="label">기록 생성일</span>
        <span class="value" th:text="${#temporals.format(meal.createdAt, 'yyyy-MM-dd HH:mm')}">2023-11-24 12:00</span>
    </div>

    <div class="btn-group">
        <a th:href="@{/meals}" class="btn btn-back">목록으로</a>
        <a href="#" class="btn btn-edit">수정하기</a> <!-- 11주차 기능 -->
    </div>
</div>

</body>
</html>
